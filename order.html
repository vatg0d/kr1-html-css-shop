<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Оформление заявки в учебном интернет-магазине.">
  <title>Оформление заявки — Учебный интернет-магазин</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">ShopProject</a>

      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="product.html">Товар</a></li>
          <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" href="order.html">Заявка</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <span class="breadcrumbs__current">Заявка</span>
    </nav>

    <section class="section">
      <h1 class="section__title">Оформление заявки</h1>
      <p class="section__text">
        Заполните форму ниже, чтобы оставить заявку на товар или консультацию.
      </p>

      <form class="order-form order-form--page" id="order-form-page" action="#" method="post" novalidate>
        <div class="order-form__field">
          <label class="order-form__label" for="order-name-page">Имя</label>
          <input class="order-form__input" id="order-name-page" name="name" type="text" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-email-page">E-mail</label>
          <input class="order-form__input" id="order-email-page" name="email" type="email" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-phone-page">Телефон</label>
          <input class="order-form__input" id="order-phone-page" name="phone" type="tel" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-topic-page">Тема заявки</label>
          <select class="order-form__select" id="order-topic-page" name="topic" required>
            <option value="">Выберите тему</option>
            <option value="product">Заказ товара</option>
            <option value="consultation">Консультация</option>
            <option value="delivery">Доставка</option>
          </select>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-comment-page">Комментарий</label>
          <textarea class="order-form__textarea" id="order-comment-page" name="comment" rows="4"></textarea>
        </div>

        <div class="order-form__field order-form__field--checkbox">
          <label class="order-form__label order-form__label--checkbox">
            <input class="order-form__checkbox" type="checkbox" name="agreement" required>
            Я согласен на обработку данных
          </label>
        </div>

        <div class="order-form__actions">
          <button class="button button--primary" type="submit">Отправить заявку</button>
        </div>
      </form>

      <p class="success-message" id="success-message-page" hidden>Форма успешно отправлена!</p>
    </section>
  </main>

  <footer class="site-footer">
    <p class="site-footer__text">&copy; 2026 Учебный проект. Все права защищены.</p>
    <p class="site-footer__text">Дисциплина: Фронтенд и бэкенд разработка</p>
  </footer>

  <button class="to-top" id="to-top" type="button" aria-label="Наверх">↑</button>

</body>
</html>
